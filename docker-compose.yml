# Home Mind & Home Generative Agent DB - Docker Compose
# AI assistant configuration with cognitive memory backends

services:
  # Shodh Memory - Cognitive memory backend
  shodh:
    build:
      context: ./docker/shodh
    container_name: home-mind-shodh
    restart: unless-stopped
    environment:
      - SHODH_HOST=0.0.0.0
      - SHODH_PORT=3030
      - SHODH_DEV_API_KEY=${SHODH_API_KEY}
    volumes:
      - shodh_data:/data
    network_mode: host

  # Piper - Lokalny syntezator mowy
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    volumes:
      - ./data-piper:/data
    network_mode: host
    command: [
      "--voice", "pl_PL-jarvis_wg_glos-medium",
      "--data-dir", "/data",
      "--download-dir", "/data"
    ]
    # Piper laduje model glosu dopiero przy pierwszym zapytaniu (~1,8 s) i
    # trzyma go potem w pamieci. Bez rozgrzewki pierwsze zdanie asystenta po
    # kazdym starcie bylo o ~1,7 s wolniejsze. Zrobione jako healthcheck, a nie
    # hook post_start, bo healthcheck dziala tez wtedy, gdy kontener wstaje bez
    # udzialu compose (restart hosta, `docker restart`, restart: unless-stopped).
    healthcheck:
      test: ["CMD", "python3", "/data/warmup.py"]
      start_period: 60s
      start_interval: 5s
      interval: 10m
      timeout: 30s
      retries: 3

  # Home Mind Server - API server
  server:
    build:
      context: ./src/home-mind-server
    container_name: home-mind-server
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=3100
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-}
      - ANTHROPIC_PROMPT_CACHING=${ANTHROPIC_PROMPT_CACHING:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Domyslnie kontener ollama ponizej. Server ma network_mode: host, wiec
      # siega po opublikowany port loopbacka, nie po nazwe uslugi.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434/v1}
      # Ile VRAM ma karta - tylko po to, by wybor modelu w HA umial powiedziec
      # "zmiesci sie" zamiast samego rozmiaru. Nie zmienia niczego w dzialaniu.
      - OLLAMA_VRAM_GB=${OLLAMA_VRAM_GB:-}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_SKIP_TLS_VERIFY=${HA_SKIP_TLS_VERIFY:-false}
      - SHODH_URL=http://127.0.0.1:3030
      - SHODH_API_KEY=${SHODH_API_KEY}
      - MEMORY_TOKEN_LIMIT=${MEMORY_TOKEN_LIMIT:-6000}
      - CONVERSATION_STORAGE=${CONVERSATION_STORAGE:-memory}
      - CONVERSATION_DB_PATH=/data/conversations.db
      - CUSTOM_PROMPT=${CUSTOM_PROMPT:-}
      - DEVICE_OVERRIDES=${DEVICE_OVERRIDES:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - API_TOKEN=${API_TOKEN:-}
      - STT_PROVIDER=${STT_PROVIDER:-none}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_BASE_URL=${STT_BASE_URL:-}
      - STT_MODEL=${STT_MODEL:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-none}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_BASE_URL=${TTS_BASE_URL:-}
      - TTS_MODEL=${TTS_MODEL:-tts-1}
      - TTS_VOICE=${TTS_VOICE:-alloy}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-tavily}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # true = the Brave account is capped at its free credit in Brave's
      # dashboard, so running out refuses instead of charging
      - BRAVE_CREDIT_ONLY=${BRAVE_CREDIT_ONLY:-false}
      # How the assistant reaches the internet: grounding | gemini_micro | tavily | brave
      - WEB_SEARCH_MODE=${WEB_SEARCH_MODE:-}
      # Key of a BILLED Google project, used only by gemini_micro search
      - GEMINI_SEARCH_API_KEY=${GEMINI_SEARCH_API_KEY:-}
      - GEMINI_SEARCH_MODEL=${GEMINI_SEARCH_MODEL:-}
      # Self-hosted search (see the searxng service below). Unset = not available.
      - SEARXNG_URL=${SEARXNG_URL:-http://127.0.0.1:8888}
      - SEARCH_ALLOW_PAID=${SEARCH_ALLOW_PAID:-false}
      - TZ=Europe/Warsaw
    volumes:
      - conversation_data:/data

  # Ollama - lokalna inferencja LLM na GPU tej maszyny. Wystawione tylko na
  # loopback: to backend dla home-mind-server (network_mode: host, wiec widzi
  # 127.0.0.1), a nie usluga dla sieci domowej.
  #
  # OLLAMA_KEEP_ALIVE trzyma model w VRAM miedzy poleceniami. Bez tego kazde
  # pytanie po dluzszej przerwie placi kilka sekund za ponowne zaladowanie wag z
  # dysku - przy asystencie domowym, ktory jest wolany zrywami, to dominujacy
  # koszt. Cena: model okupuje VRAM takze wtedy, gdy nikt nie pyta.
  ollama:
    image: ollama/ollama:latest
    container_name: home-mind-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # SearXNG - self-hosted metasearch, so the assistant can reach the internet
  # without an API key, an account, or a monthly allowance to run out of.
  # Published on loopback only: it is an internal API, not a public instance.
  # Port 8888 because 8080 belongs to Kodi's JSON-RPC on this machine.
  searxng:
    image: searxng/searxng:latest
    container_name: home-mind-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Baza danych dla Home Generative Agent
  hga-db:
    image: ankane/pgvector:latest
    container_name: hga-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_assistant_ai
      POSTGRES_USER: hga_admin
      POSTGRES_PASSWORD: MojeBezpieczneHaslo123!
    network_mode: host
    volumes:
      - hga_db_data:/var/lib/postgresql/data


volumes:
  ollama_models:
    driver: local
  shodh_data:
    driver: local
  conversation_data:
    driver: local
  hga_db_data:
    driver: local


