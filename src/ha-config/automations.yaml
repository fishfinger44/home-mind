- id: '1776277919553'
  alias: Govee - Główny Przełącznik Max
  description: Włącza na 100% jeśli zgaszone, gasi jeśli zapalone - niezależnie od
    Siri
  triggers:
  - trigger: state
    entity_id: input_boolean.govee_max_warm_trigger
    to: 'on'
  actions:
  - if:
    - condition: state
      entity_id: light.h60c1
      state: 'off'
    then:
    - action: light.turn_on
      target:
        entity_id:
        - light.h60c1
        - light.h60c1_2
      data:
        brightness_pct: 100
        color_temp_kelvin: 2700
    else:
    - action: light.turn_off
      target:
        entity_id:
        - light.h60c1
        - light.h60c1_2
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.govee_max_warm_trigger
  mode: restart
- id: '1776288696342'
  alias: Govee - Sciemnij o 20
  triggers:
  - trigger: state
    entity_id: input_boolean.govee_ciemniej
    to: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.h60c1
      - light.h60c1_2
    data:
      brightness_pct: '{% set current = state_attr(''light.h60c1'', ''brightness'')
        | int(0) / 2.55 %} {{ [current - 20, 10] | max | int }}

        '
      color_temp_kelvin: 2700
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.govee_ciemniej
  mode: restart
- id: '1776288820265'
  alias: Govee - Jasniej o 20
  triggers:
  - trigger: state
    entity_id: input_boolean.govee_jasniej
    to: 'on'
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.h60c1
      - light.h60c1_2
    data:
      brightness_pct: '{% set current = state_attr(''light.h60c1'', ''brightness'')
        | int(0) / 2.55 %} {{ [current + 20, 100] | min | int }}

        '
      color_temp_kelvin: 2700
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.govee_jasniej
  mode: restart
